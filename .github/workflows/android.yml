name: Android APK

# Builds the simplytake Android app and publishes it as the
# "android-test" pre-release, so the latest APK can be installed from a phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache MediaPipe models
        uses: actions/cache@v4
        with:
          path: .models
          key: mediapipe-models-v2

      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android

      # Private signing key from repository secrets. Without it the build
      # falls back to the public test key (anyone could sign a lookalike).
      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=private release key" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set – signing with the public test key"
            echo "SIGNED_WITH=PUBLIC TEST KEY (not secure – add the signing secrets)" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Report APK size
        run: ls -la android/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: simplytake-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk simplytake.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test simplytake.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "simplytake – Android test build #${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open this page on your phone, download simplytake.apk and allow installing from your browser. Signed with: ${SIGNED_WITH}. Experimental test build – not from the Play Store."
