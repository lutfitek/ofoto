name: Web app (GitHub Pages)

# Builds the self-contained web app (MediaPipe runtime and models bundled, so
# nothing is fetched from third-party CDNs) and publishes it to the gh-pages
# branch, served at https://lutfitek.github.io/simplytake/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache MediaPipe models
        uses: actions/cache@v4
        with:
          path: .models
          key: mediapipe-models-v2

      - run: npm ci
      - run: npm test
      - run: npm run build:web

      - name: Publish www/ to gh-pages
        working-directory: www
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
